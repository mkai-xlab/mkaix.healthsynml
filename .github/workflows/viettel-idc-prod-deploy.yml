name: Deliver ML Service to Viettel IDC
run-name: Viettel IDC ML delivery requested by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirm_delivery:
        description: "Confirm deployment of the latest main branch to Viettel IDC"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ml-viettel-idc-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_delivery
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Deliver ML service via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VIETTEL_PUBLIC_IP }}
          username: root
          password: ${{ secrets.VIETTEL_PASSWORD }}
          script: |
            set -e
            cd ~/healthsync/mkaix.healthsynml/
            git checkout main
            git pull --ff-only origin main
            docker compose config --quiet
            docker rm -f knee-oa-ai || true
            docker compose up -d --build ai
            docker image prune -f
