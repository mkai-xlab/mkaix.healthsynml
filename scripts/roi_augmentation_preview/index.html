<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knee ROI Augmentation Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f8; color: #17202a; }
    header { height: 58px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #dfe4e8; }
    h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: 0; }
    .status { font-size: 12px; color: #39734f; }
    main { max-width: 1280px; margin: 0 auto; padding: 22px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 18px; }
    label { display: grid; gap: 5px; font-size: 12px; color: #59636e; }
    input[type="file"], input[type="number"] { height: 38px; border: 1px solid #cbd2d9; border-radius: 5px; background: #fff; padding: 8px 10px; color: #17202a; }
    input[type="number"] { width: 150px; }
    button, .download { height: 38px; border: 1px solid #1e596f; border-radius: 5px; padding: 0 15px; background: #1e596f; color: #fff; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    button.secondary { background: #fff; color: #1e596f; }
    button:disabled { opacity: .5; cursor: wait; }
    .download[hidden] { display: none; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; background: #fff; border: 1px solid #dfe4e8; border-radius: 6px; overflow: hidden; min-height: 360px; }
    figcaption { height: 42px; display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid #e7ebee; font-size: 13px; font-weight: 600; }
    .viewport { min-height: 318px; display: grid; place-items: center; background: #111; }
    .viewport img { display: block; max-width: 100%; max-height: 70vh; object-fit: contain; }
    .empty { color: #aeb7bf; font-size: 13px; }
    .meta { margin-top: 14px; padding: 12px 14px; min-height: 44px; background: #fff; border: 1px solid #dfe4e8; border-radius: 6px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .error { color: #a12828; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } main { padding: 14px; } header { padding: 0 14px; } }
  </style>
</head>
<body>
  <header><h1>Knee ROI Augmentation Preview</h1><span class="status" id="status">Ready</span></header>
  <main>
    <div class="toolbar">
      <label>ROI image<input id="file" type="file" accept="image/png,image/jpeg"></label>
      <label>Seed<input id="seed" type="number" min="0" max="4294967295" value="42"></label>
      <button id="generate" type="button">Generate</button>
      <button id="randomize" type="button" class="secondary">New seed</button>
      <a id="download" class="download" download="augmented_roi.png" hidden>Download</a>
    </div>
    <section class="grid">
      <figure><figcaption>Original ROI</figcaption><div class="viewport" id="original"><span class="empty">No image</span></div></figure>
      <figure><figcaption>Augmented 384 x 384</figcaption><div class="viewport" id="result"><span class="empty">No result</span></div></figure>
    </section>
    <div class="meta" id="meta">Seed and applied operations will appear here.</div>
  </main>
  <script>
    const fileInput = document.querySelector('#file');
    const seedInput = document.querySelector('#seed');
    const generate = document.querySelector('#generate');
    const randomize = document.querySelector('#randomize');
    const download = document.querySelector('#download');
    const original = document.querySelector('#original');
    const result = document.querySelector('#result');
    const meta = document.querySelector('#meta');
    const status = document.querySelector('#status');
    let originalUrl = null;
    let resultUrl = null;

    function showOriginal() {
      const file = fileInput.files[0];
      if (!file) return;
      if (originalUrl) URL.revokeObjectURL(originalUrl);
      originalUrl = URL.createObjectURL(file);
      original.innerHTML = '';
      const image = new Image(); image.src = originalUrl; image.alt = 'Original knee ROI';
      original.appendChild(image);
    }

    fileInput.addEventListener('change', showOriginal);
    randomize.addEventListener('click', () => {
      seedInput.value = crypto.getRandomValues(new Uint32Array(1))[0];
    });
    generate.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) { meta.textContent = 'Select a PNG or JPEG ROI first.'; meta.classList.add('error'); return; }
      generate.disabled = true; status.textContent = 'Processing'; meta.classList.remove('error');
      try {
        const form = new FormData(); form.append('image', file);
        const response = await fetch(`/augment?seed=${encodeURIComponent(seedInput.value)}`, { method: 'POST', body: form });
        if (!response.ok) { const payload = await response.json(); throw new Error(payload.detail || 'Augmentation failed'); }
        const blob = await response.blob();
        if (resultUrl) URL.revokeObjectURL(resultUrl);
        resultUrl = URL.createObjectURL(blob);
        result.innerHTML = '';
        const image = new Image(); image.src = resultUrl; image.alt = 'Augmented knee ROI';
        result.appendChild(image);
        download.href = resultUrl; download.hidden = false;
        const usedSeed = response.headers.get('X-Augmentation-Seed');
        const operations = response.headers.get('X-Augmentation-Operations');
        download.download = `augmented_roi_seed_${usedSeed}.png`;
        meta.textContent = `seed=${usedSeed} | ${operations}`;
        status.textContent = 'Ready';
      } catch (error) {
        meta.textContent = error.message; meta.classList.add('error'); status.textContent = 'Error';
      } finally { generate.disabled = false; }
    });
  </script>
</body>
</html>
